<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@900&family=Roboto+Mono:wght@700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: transparent; overflow: hidden; }
</style>
</head>
<body>
<div style="
  width: 500px;
  height: 500px;
  background: rgba(15, 23, 42, 0.95);
  border: 4px solid #2563eb;
  border-radius: 24px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 32px;
">
  <!-- Monogram Glyph -->
  <svg viewBox="0 0 300 240" style="width: 220px; height: 160px; margin-bottom: 20px;">
    <!-- Blue shadow -->
    <path d="M 55 25 C 130 22, 215 25, 245 42 C 275 60, 275 100, 245 125 C 220 145, 185 148, 155 152 C 200 158, 270 170, 275 212 C 280 255, 240 295, 175 305 C 125 310, 75 308, 55 308 Z"
      transform="scale(0.7) translate(12, 12)" fill="#2563eb" stroke="#2563eb" stroke-width="8"></path>
    <!-- Solid Bright B -->
    <path d="M 55 25 C 130 22, 215 25, 245 42 C 275 60, 275 100, 245 125 C 220 145, 185 148, 155 152 C 200 158, 270 170, 275 212 C 280 255, 240 295, 175 305 C 125 310, 75 308, 55 308 Z"
      transform="scale(0.7)" fill="#f8fafc" stroke="#f8fafc" stroke-width="8"></path>
    <!-- Cutouts -->
    <path d="M 105 70 C 140 68, 190 70, 200 82 C 210 94, 210 112, 190 120 C 165 126, 130 124, 105 125 Z"
      transform="scale(0.7)" fill="#0f172a" stroke="#2563eb" stroke-width="4"></path>
    <path d="M 105 175 C 145 172, 200 175, 210 192 C 220 210, 215 245, 190 255 C 160 264, 125 262, 105 263 Z"
      transform="scale(0.7)" fill="#0f172a" stroke="#2563eb" stroke-width="4"></path>
    <!-- Spotlight -->
    <circle cx="38" cy="106" r="10" fill="#00ff41"></circle>
  </svg>

  <div style="font-family: 'Poppins', sans-serif; font-weight: 900; font-size: 42px; color: #e2e8f0; letter-spacing: -0.02em;">
    BUILD<span style="color: #2563eb;">STATION</span>
  </div>
  <div style="font-family: 'Roboto Mono', monospace; font-size: 14px; font-weight: 700; color: #00ff41; letter-spacing: 3px; margin-top: 6px;">
    SUBSCRIBE
  </div>
</div>
</body>
</html>
