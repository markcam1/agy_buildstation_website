<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #020617;
    margin: 0;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  .canvas {
    width: 800px;
    height: 800px;
    position: relative;
    border-radius: 50%;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0f172a;
    border: 28px solid #2563eb;
  }
</style>
</head>
<body>

<!-- Variant A: High-Contrast Pure White B on #0f172a with 28px Electric Blue Border -->
<div class="canvas">
  <svg viewBox="0 0 800 800" width="800" height="800" style="display:block;" role="img" aria-label="Buildstation Avatar">
    <text x="400" y="595" text-anchor="middle" font-family="'Poppins', sans-serif" font-weight="900" font-size="590" fill="#ffffff" letter-spacing="-0.02em">B</text>
  </svg>
</div>

</body>
</html>
