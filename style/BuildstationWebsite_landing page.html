  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);

yle>\n<\u002Fhelmet>\n<div style=\"background: #0f172a; color: #e2e8f0; font-family: Inter, system-ui, sans-serif; min-height: 100vh; overflow-x: hidden\" data-canvas-width=\"1440\" data-canvas-height=\"6000\" data-document-role=\"page\" data-label=\"Buildstation — landing page\">\n\n<!-- NAV -->\n<main id=\"top\">\n\n<!-- HERO -->\n<section style=\"max-width: 1200px; margin: 0 auto; padding: 96px 24px 72px; display: flex; flex-wrap: wrap; gap: 56px; align-items: center\">\n<div style=\"flex: 1 1 460px; min-width: 0; display: flex; flex-direction: column; gap: 28px\">\n<p style=\"margin: 0; font-family: 'Roboto Mono', monospace; font-weight: 500; font-size: 14px; color: #94a3b8\">$ ./buildstation --harness aider,openhands,swe-agent --local-only<\u002Fp>\n<h1 style=\"margin: 0; font-family: Poppins, sans-serif; font-weight: 900; font-size: clamp(44px, 6vw, 76px); line-height: 1.02; letter-spacing: -0.02em; color: #e2e8f0\">The leaderboard ran on an H100. <span style=\"font-weight: 600; color: #94a3b8\">You have<\u002Fspan> <span style=\"font-family: 'Roboto Mono', monospace; font-weight: 700; color: #2563eb\">16GB<\u002Fspan><span style=\"font-weight: 600; color: #94a3b8\">.<\u002Fspan><\u002Fh1>\n<p style=\"margin: 0; font-size: 19px; line-height: 1.6; color: #94a3b8; max-width: 540px\">Buildstation tests coding agents on small local models: Aider, OpenHands, SWE-agent, AutoCodeRover and more, running open-weight models on consumer hardware. Same rig, real numbers, measured rather than claimed.<\u002Fp>\n<div style=\"display: flex; flex-wrap: wrap; gap: 16px; align-items: center\">\n<a href=\"#videos\" style=\"font-family: 'Roboto Mono', monospace; font-weight: 700; font-size: 16px; color: #0f172a; background: #00ff41; text-decoration: none; border-radius: 6px; padding: 16px 24px; min-height: 52px; box-sizing: border-box; display: inline-flex; align-items: center; gap: 10px\">\n<svg aria-hidden=\"true\" width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 18 18\"><pat "middle\" font-family=\"Caveat, cursive\" font-weight=\"700\" font-size=\"30\" fill=\"#e2e8f0\">RTX 4060 Ti<\u002Ftext>\n<text x=\"140\" y=\"134\" text-anchor=\"middle\" font-family=\"Roboto Mono, monospace\" font-weight=\"700\" font-size=\"22\" fill=\"#2563eb\">16GB VRAM<\u002Ftext>\n<!-- box B: runtime -->\n<path d=\"M318 50 C 390 47, 460 52, 530 49 C 532 90, 529 125, 531 160 C 460 163, 390 158, 317 161 C 315 120, 319 85, 318 50\" fill=\"none\" stroke=\"#e2e8f0\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath>\n<path d=\"M315 47 C 400 52, 470 47, 528 52 C 529 88, 533 130, 529 163 C 450 160, 380 164, 319 159 C 317 125, 313 80, 316 49\" fill=\"none\" stroke=\"#e2e8f0\" stroke-width=\"1.3\" stroke-linecap=\"round\"><\u002Fpath>\n<text x=\"424\" y=\"96\" text-anchor=\"middle\" font-family=\"Caveat, cursive\" font-weight=\"700\" font-size=\"30\" fill=\"#e2e8f0\">ollama · vllm<\u002Ftext>\n<text x=\"424\" y=\"134\" text-anchor=\"middle\" font-family=\"Roboto Mono, monospace\" font-weight=\"500\" font-size=\"17\" fill=\"#94a3b8\">llama.cpp<\u002Ftext>\n<!-- arrow A to B -->\n<path d=\"M254 104 C 270 98, 292 99, 310 105\" fill=\"none\" stroke=\"#e2e8f0\" stroke-width=\"2.4\" stroke-linecap=\"round\"><\u002Fpath>\n<path d=\"M298 95 L 311 105 L 297 113\" fill=\"none\" stroke=\"#e2e8f0\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath>\n<!-- ellipse C: result -->\n<path d=\"M286 248 C 372 244, 422 272, 418 312 C 414 352, 360 372, 284 370 C 206 368, 152 346, 154 308 C 156 270, 208 250, 290 249\" fill=\"url(#hachHero)\" stroke=\"none\"><\u002Fpath>\n<path d=\"M286 248 C 372 244, 422 272, 418 312 C 414 352, 360 372, 284 370 C 206 368, 152 346, 154 308 C 156 270, 208 250, 290 249\" fill=\"none\" stroke=\"#e2e8f0\" stroke-width=\"2.4\" stroke-linecap=\"round\"><\u002Fpath>\n<path d=\"M282 245 C 368 248, 425 276, 420 316 C 412 356, 352 375, 280 373 C 200 371, 150 342, 152 304 C 158 266, 214 246, 300 247\" fill=\"none\" stroke=\"#e2e8f0\" stroke-width=\"1.2\" stroke-linecap=\"round\"><\u002Fpath>\n<rect x=\"216\" y=\"286\" width=\"136\" height=\"48\" rx=\"6\" fill=\"#0f172a\"><\u002Frect>\n<text x=\"284\" y=\"320\" text-anchor=\"middle\" font-family=\"Roboto Mono, monospace\" font-weight=\"700\" font-size=\"26\" fill=\"#e2e8f0\">tok/s<\u002Ftext>\n<!-- arrow B to C -->\n<path d=\"M428 170 C 432 206, 418 232, 394 258\" fill=\"none\" stroke=\"#e2e8f0\" stroke-width=\"2.4\" stroke-linecap=\"round\"><\u002Fpath>\n<path d=\"M391 242 L 393 260 L 410 253\" fill=\"none\" stroke=\"#e2e8f0\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath>\n<!-- dashed A to C (constraint) -->\n<path d=\"M140 170 C 138 210, 160 238, 190 262\" fill=\"none\" stroke=\"#94a3b8\" stroke-width=\"2\" stroke-dasharray=\"6 7\" stroke-linecap=\"round\"><\u002Fpath>\n<text x=\"40\" y=\"226\" font-family=\"Caveat, cursive\" font-weight=\"500\" font-size=\"24\" fill=\"#94a3b8\">the real ceiling<\u002Ftext>\n<!-- annotation -->\n<text x=\"330\" y=\"420\" font-family=\"Caveat, cursive\" font-weight=\"700\" font-size=\"28\" fill=\"#e2e8f0\">measured, not claimed<\u002Ftext>\n<path d=\"M376 396 C 368 384, 362 378, 352 372\" fill=\"none\" stroke=\"#e2e8f0\" stroke-width=\"2\" stroke-linecap=\"round\"><\u002Fpath>\n<path d=\"M352 386 L 350 371 L 364 372\" fill=\"none\" stroke=\"#e2e8f0\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath>\n<\u002Fsvg>\n<\u002Ffigure>\n<\u002Fsection>\n\n<!-- TEST BENCH STRIP -->\n<section aria-label=\"The test bench\" style=\"border-top: 1px solid #1e293b; border-bottom: 1px solid #1e293b\">\n<div style=\"max-width: 1200px; margin: 0 auto; padding: 24px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center\">\n<span style=\"font-family: Caveat, cursive; font-weight: 700; font-size: 26px; color: #94a3b8; margin-right: 12px\">the test bench →<\u002Fspan>\n<span style=\"font-family: 'Roboto Mono', monospace; font-weight: 500; font-size: 15px; color: #e2e8f0; border: 1px solid #94a3b8; border-radius: 4px; padding: 8px 12px\">i7-14700KF<\u002Fspan>\n<span style=\"font-family: 'Roboto Mono', monospace; font-weight: 500; font-size: 15px; color: #e2e8f0; border: 1px solid #94a3b8; border-radius: 4px; padding: 8px 12px\">RTX 4060 Ti · 16GB<\u002Fspan>\n<span style=\"font-family: 'Roboto Mono', monospace; font-weight: 500; font-size: 15px; color: #e2e8f0; border: 1px solid #94a3b8; border-radius: 4px; padding: 8px 12px\">32GB DDR5-4800<\u002Fspan>\n<span style=\"font-family: 'Roboto Mono', monospace; font-weight: 500; font-size: 15px; color: #e2e8f0; border: 1px solid #94a3b8; border-radius: 4px; padding: 8px 12px\">Linux Mint 21.3<\u002Fspan>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- HARNESSES -->\n<section id=\"harnesses\" style=\"max-width: 1200px; margin: 0 auto; padding: 112px 24px 24px; display: flex; flex-wrap: wrap; gap: 56px; align-items: center\">\n<div style=\"flex: 1 1 460px; min-width: 0; display: flex; flex-direction: column; gap: 24px\">\n<p style=\"margin: 0; font-family: 'Roboto Mono', monospace; font-weight: 500; font-size: 14px; color: #94a3b8\">// the niche<\u002Fp>\n<h2 style=\"margin: 0; font-family: Poppins, sans-serif; font-weight: 800; font-size: clamp(34px, 4vw, 52px); line-height: 1.08; letter-spacing: -0.02em; color: #e2e8f0\">Coding harnesses on small local models<\u002Fh2>\n<p style=\"margin: 0; font-size: 18px; line-height: 1.6; color: #94a3b8\">A coding agent is a model plus a scaffold. Put the same <span style=\"font-family: 'Roboto Mono', monospace; font-weight: 500; color: #e2e8f0\">7–12B<\u002Fspan> model in a different harness and you get a different agent. Buildstation tests the two separately, on <span style=\"font-family: 'Roboto Mono', monospace; font-weight: 500; color: #e2e8f0\">16GB<\u002Fspan>, so you know which one to change.<\u002Fp>\n<ul aria-label=\"Harnesses under test\" style=\"margin: 0; padding: 0; list-style: none; display: flex; ont-size=\"24\" fill=\"#2563eb\">9B<\u002Ftext>\n<text x=\"465\" y=\"64\" text-anchor=\"middle\" font-family=\"Roboto Mono, monospace\" font-weight=\"700\" font-size=\"24\" fill=\"#2563eb\">12B<\u002Ftext>\n<text x=\"34\" y=\"119\" font-family=\"Roboto Mono, monospace\" font-weight=\"500\" font-size=\"18\" fill=\"#e2e8f0\">aider<\u002Ftext>\n<text x=\"34\" y=\"184\" font-family=\"Roboto Mono, monospace\" font-weight=\"500\" font-size=\"18\" fill=\"#e2e8f0\">openhands<\u002Ftext>\n<text x=\"34\" y=\"249\" font-family=\"Roboto Mono, monospace\" font-weight=\"500\" font-size=\"18\" fill=\"#e2e8f0\">swe-agent<\u002Ftext>\n<text x=\"34\" y=\"314\" font-family=\"Roboto Mono, monospace\" font-weight=\"500\" font-size=\"17\" fill=\"#e2e8f0\">autocoderover<\u002Ftext>\n<g font-family=\"Caveat, cursive\" font-weight=\"700\" font-size=\"30\" fill=\"#94a3b8\" text-anchor=\"middle\">\n<text x=\"245\" y=\"122\">?<\u002Ftext><text x=\"355\" y=\"122\">?<\u002Ftext><text x=\"465\" y=\"122\">?<\u002Ftext>\n<text x=\"245\" y=\"187\">?<\u002Ftext><text x=\"355\" y=\"187\">?<\u002Ftext><text x=\"465\" y=\"187\">?<\u002Ftext>\n<text x=\"245\" y=\"252\">?<\u002Ftext><text x=\"355\" y=\"252\">?<\u002Ftext><text x=\"465\" y=\"252\">?<\u002Ftext>\n<text x=\"245\" y=\"317\">?<\u002Ftext><text x=\"355\" y=\"317\">?<\u002Ftext><text x=\"465\" y=\"317\">?<\u002Ftext>\n<\u002Fg>\n<path d=\"M246 76 C 286 74, 300 120, 299 210 C 298 300, 284 344, 244 344 C 204 344, 192 300, 191 210 C 190 120, 204 78, 250 77\" fill=\"none\" stroke=\"#e2e8f0\" stroke-width=\"2.6\" stroke-linecap=\"round\"><\u002Fpath>\n<path d=\"M300 392 C 280 380, 262 368, 252 352\" fill=\"none\" stroke=\"#e2e8f0\" stroke-width=\"2\" stroke-linecap=\"round\"><\u002Fpath>\n<path d=\"M249 368 L 251 351 L 265 359\" fill=\"none\" stroke=\"#e2e8f0\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath>\n<text x=\"308\" y=\"398\" font-family=\"Caveat, cursive\" font-weight=\"700\" font-size=\"28\" fill=\"#e2e8f0\">same model, four harnesses<\u002Ftext>\n<\u002Fsvg>\n<\u002Ffigure>\n<\u002Fsection>\n\n<!-- PROBLEM -->\n<section id=\"about\" style=\"max-width: 1200px; margin: 0 auto; padding: 112px 24px 48px; display: flex; flex-direction: column; gap: 48px\">\n<div style=\"display: flex; flex-direction: column; gap: 16px; max-width: 720px\">\n<p style=\"margin: 0; font-family: 'Roboto Mono', monospace; font-weight: 500; font-size: 14px; color: #94a3b8\">// 01 the problem<\u002Fp>\n<h2 style=\"margin: 0; font-family: Poppins, sans-serif; font-weight: 800; font-size: clamp(34px, 4vw, 52px); line-height: 1.08; letter-spacing: -0.02em; color: #e2e8f0\">The spec-sheet problem<\u002Fh2>\n<p style=\"margin: 0; font-size: 18px; line-height: 1.6; color: #94a3b8\">Most model coverage tells you what a model can do on hardware you will never own. That number doesn't help you pick what to run tonight.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; gap: 28px\">\n\n<article style=\"flex: 1 1 300px; min-width: 0; position: relative; padding: 32px; display: flex; flex-direction: column; gap: 16px\">\n<svg aria-hidden=\"true\" sc-camel-view-box=\"0 0 100 100\" sc-camel-preserve-aspect-ratio=\"none\" style=\"position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none\"><path d=\"M1 1.5 C 30 0.5, 70 2, 99 1 C 99.5 30, 98.6 70, 99 99 C 70 99.6, 30 98.5, 1 99.2 C 0.4 70, 1.5 30, 1 1.5\" fill=\"none\" stroke=\"#94a3b8\" stroke-width=\"1.8\" stroke-linecap=\"round\" vector-effect=\"non-scaling-stroke\"><\u002Fpath><path d=\"M0.4 0.8 C 35 1.8, 65 0.3, 99.6 1.9 C 98.9 35, 100 65, 98.7 99.5 C 65 98.8, 35 100, 0.6 98.6 C 1.2 65, 0 35, 0.4 0.8\" fill=\"none\" stroke=\"#94a3b8\" stroke-width=\"1\" stroke-linecap=\"round\" vector-effect=\"non-scaling-stroke\"><\u002Fpath><\u002Fsvg>\n<svg aria-hidden=\"true\" width=\"72\" height=\"72\" sc-camel-view-box=\"0 0 72 72\">\n<path d=\"M14 10 C 30 9, 44 11, 58 10 L 58 24 C 44 25, 28 23, 14 24 Z\" fill=\"none\" stroke=\"#e2e8f0\" stroke-width=\"2.2\" stroke-linejoin=\"round\"><\u002Fpath>\n<path d=\"M14 29 C 30 28, 44 30, 58 29 L 58 43 C 44 44, 28 42, 14 43 Z\" fill=\"none\" stroke=\"#e2e8f0\" stroke-width=\"2.2\" stroke-linejoin=\"round\"><\u002Fpath>\n<path d=\"M14 48 C 30 47, 44 49, 58 48 L 58 62 C 44 63, 28 61, 14 62 Z\" fill=\"none\" stroke=\"#e2e8f0\" stroke-width=\"2.2\" stroke-linejoin=\"round\"><\u002Fpath>\n<path d=\"M20 17 L 26 17 M20 36 L 26 36 M20 55 L 26 55\" stroke=\"#2563eb\" stroke-width=\"3\" stroke-linecap=\"round\"><\u002Fpath>\n<path d=\"M6 66 C 26 46, 46 26, 66 6\" fill=\"none\" stroke=\"#94a3b8\" stroke-width=\"2.6\" stroke-linecap=\"round\"><\u002Fpath>\n<\u002Fsvg>\n<h3 style=\"margin: 0; font-family: Poppins, sans-serif; font-weight: 800; font-size: 24px; letter-spacing: -0.02em; color: #e2e8f0\">Benchmarks run in a datacenter<\u002Fh3>\n<p style=\"margin: 0; font-size: 16px; line-height: 1.6; color: #94a3b8\">Headline scores come off multi-GPU servers. Quantized to fit <span style=\"font-family: 'Roboto Mono', monospace; font-weight: 500; color: #e2e8f0\">16GB<\u002Fspan>, the same model behaves differently.<\u002Fp>\n<\u002Farticle>\n\n<article style=\"flex: 1 1 300px; min-width: 0; position: relative; padding: 32px; display: flex; flex-direction: column; gap: 16px\">\n<svg aria-hidden=\"true\" sc-camel-view-box=\"0 0 100 100\" sc-camel-preserve-aspect-ratio=\"none\" style=\"position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none\"><path d=\"M1.2 1 C 30 2, 70 0.4, 98.8 1.6 C 99.6 30, 98.4 70, 99.2 98.8 C 70 99.8, 30 98.2, 0.8 99 C 1.6 70, 0.2 30, 1.2 1\" fill=\"none\" stroke=\"#94a3b8\" stroke-width=\"1.8\" stroke-linecap=\"round\" vector-effect=\"non-scaling-stroke\"><\u002Fpath><path d=\"M0.5 1.9 C 35 0.6, 65 2.2, 99.5 0.7 C 98.6 35, 99.9 65, 98.9 99.6 C 65 98.5, 35 99.9, 0.3 98.7 C 1.4 65, 0.1 35, 0.5 1.9\" fill=\"none\" stroke=\"#94a3b8\" stroke-width=\"1\" stroke-linecap=\"round\" vector-effect=\"non-scaling-stroke\"><\u002Fpath><\u002Fsvg>\n<svg aria-hidden=\"true\" width=\"72\" height=\"72\" sc-camel-view-box=\"0 0 72 72\">\n<path d=\"M12 28 C 12 26, 13 24, 16 24 L 26 24 L 50 10 C 52 30, 52 44, 50 62 L 26 48 L 16 48 C 13 48, 12 46, 12 44 Z\" fill=\"none\" stroke=\"#e2e8f0\" stroke-width=\"2.2\" stroke-linejoin=\"round\"><\u002Fpath>\n<path d=\"M22 49 C 23 56, 25 61, 28 64\" fill=\"none\" stroke=\"#e2e8f0\" stroke-width=\"2.2\" stroke-linecap=\"round\"><\u002Fpath>\n<path d=\"M57 26 C 60 28, 61 32, 60 36 M62 18 C 68 24, 69 40, 62 48\" fill=\"none\" stroke=\"#2563eb\" stroke-width=\"2.6\" stroke-linecap=\"round\"><\u002Fpath>\n<\u002Fsvg>\n<h3 style=\"margin: 0; font-family: Poppins, sans-serif; font-weight: 800; font-size: 24px; letter-spacing: -0.02em; color: #e2e8f0\">Launch day, no numbers<\u002Fh3>\n<p style=\"margin: 0; font-size: 16px; line-height: 1.6; color: #94a3b8\">Every release is \"a new frontier.\" Few posts tell you the quant, the context length or the tokens per second you'll actually get.<\u002Fp>\n<\u002Farticle>\n\n<article style=\"flex: 1 1 300px; min-width: 0; position: relative; padding: 32px; display: flex; flex-direction: column; gap: 16px\">\n<svg aria-hidden=\"true\" sc-camel-view-box=\"0 0 100 100\" sc-camel-preserve-aspect-ratio=\"none\" style=\"position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none\"><path d=\"M0.8 1.4 C 30 0.6, 70 1.8, 99.2 0.9 C 98.7 30, 99.6 70, 98.9 99.1 C 70 98.4, 30 99.7, 1.1 98.9 C 0.3 70, 1.6 30, 0.8 1.4\" fill=\"none\" stroke=\"#94a3b8\" stroke-width=\"1.8\" stroke-linecap=\"round\" vector-effect=\"non-scaling-stroke\"><\u002Fpath><path d=\"M1.5 0.6 C 35 1.6, 65 0.2, 99.8 1.3 C 99.1 35, 100 65, 99.3 99.4 C 65 99.9, 35 98.6, 0.5 99.6 C 1.1 65, 0.2 35, 1.5 0.6\" fill=\"none\" stroke=\"#94a3b8\" stroke-width=\"1\" stroke-linecap=\"round\" vector-effect=\"non-scaling-stroke\"><\u002Fpath><\u002Fsvg>\n<svg aria-hidden=\"true\" width=\"72\" height=\"72\" sc-camel-view-box=\"0 0 72 72\">\n<defs><pattern id=\"hachMeter\" width=\"6\" height=\"6\" sc-camel-pattern-units=\"userSpaceOnUse\" sc-camel-pattern-transform=\"rotate(-45)\"><line x1=\"0\" y1=\"0\" x2=\"0\" y2=\"6\" stroke=\"#2563eb\" stroke-width=\"2\"><\u002Fline><\u002Fpattern><\u002Fdefs>\n<path d=\"M24 64 C 24 46, 25 26, 24 8 C 32 7, 40 9, 48 8 C 49 26, 47 46, 48 64 C 40 65, 32 63, 24 64 Z\" fill=\"none\" stroke=\"#e2e8f0\" stroke-width=\"2.2\" stroke-linejoin=\"round\"><\u002Fpath>\n<path d=\"M26 62 L 26 16 L 46 15 L 46 62 Z\" fill=\"url(#hachMeter)\"><\u002Fpath>\n<path d=\"M16 15 C 30 13, 46 16, 58 14\" fill=\"none\" stroke=\"#94a3b8\" stroke-width=\"2.2\" stroke-dasharray=\"4 4\" stroke-linecap=\"round\"><\u002Fpath>\n<\u002Fsvg>\n<h3 style=\"margin: 0; font-family: Poppins, sans-serif; font-weight: 800; font-size: 24px; letter-spacing: -0.02em; color: #e2e8f0\">VRAM is the real limit<\u002Fh3>\n<p style=\"margin: 0; font-size: 16px; line-height: 1.6; color: #94a3b8\">Parameter count, quant and context all draw from the same <span style=\"font-family: 'Roboto Mono', monospace; font-weight: 500; color: #e2e8f0\">16GB<\u002Fspan>. Every test here starts from that budget.<\u002Fp>\n<\u002Farticle>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- WHAT YOU GET -->\n<section id=\"method\" style=\"max-width: 1200px; margin: 0 auto; padding: 96px 24px; display: flex; flex-wrap: wrap; gap: 56px; align-items: flex-start\">\n<div style=\"flex: 1 1 440px; min-width: 0; display: flex; flex-direction: column; gap: 32px\">\n<div style=\"display: flex; flex-direction: column; gap: 16px\">\n<p style=\"margin: 0; font-family: 'Roboto Mono', monospace; font-weight: 500; font-size: 14px; color: #94a3b8\">// 02 the method<\u002Fp>\n<h2 style=\"margin: 0; font-family: Poppins, sans-serif; font-weight: 800; font-size: clamp(34px, 4vw, 52px); line-height: 1.08; letter-spacing: -0.02em; color: #e2e8f0\">Every test is a run you can repeat<\u002Fh2>\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 14px\">\n<h3 style=\"margin: 0; font-family: Poppins, sans-serif; font-weight: 600; font-size: 24px; color: #e2e8f0\">What you get<\u002Fh3>\n<ul style=\"margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 14px\">\n<li style=\"display: flex; gap: 14px; align-items: flex-start; font-size: 17px; line-height: 1.5; color: #e2e8f0\"><svg aria-hidden=\"true\" width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" style=\"flex: 0 0 24px; margin-top: 1px\"><path d=\"M3 13 C 6 15, 8 18, 9 20 C 12 13, 16 8, 21 4\" fill=\"none\" stroke=\"#e2e8f0\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>Model, quant and context length, stated up front<\u002Fli>\n<li style=\"display: flex; gap: 14px; align-items: flex-start; font-size: 17px; line-height: 1.5; color: #e2e8f0\"><svg aria-hidden=\"true\" width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" style=\"flex: 0 0 24px; margin-top: 1px\"><path d=\"M3 13 C 6 15, 8 18, 9 20 C 12 13, 16 8, 21 4\" fill=\"none\" stroke=\"#e2e8f0\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><span><span style=\"font-family: 'Roboto Mono', monospace; font-weight: 500\">tok/s<\u002Fspan> and <span style=\"font-family: 'Roboto Mono', monospace; font-weight: 500\">vram_used<\u002Fspan> on the same rig, every time<\u002Fspan><\u002Fli>\n<li style=\"display: flex; gap: 14px; align-items: flex-start; font-size: 17px; line-height: 1.5; color: #e2e8f0\"><svg aria-hidden=\"true\" width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" style=\"flex: 0 0 24px; margin-top: 1px\"><path d=\"M3 13 C 6 15, 8 18, 9 20 C 12 13, 16 8, 21 4\" fill=\"none\" stroke=\"#e2e8f0\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>The exact command and config, so you can rerun it<\u002Fli>\n<li style=\"display: flex; gap: 14px; align-items: flex-start; font-size: 17px; line-height: 1.5; color: #e2e8f0\"><svg aria-hidden=\"true\" width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" style=\"flex: 0 0 24px; margin-top: 1px\"><path d=\"M3 13 C 6 15, 8 18, 9 20 C 12 13, 16 8, 21 4\" fill=\"none\" stroke=\"#e2e8f0\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>A verdict: what to run, and what to skip<\u002Fli>\n<\u002Ful>\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 14px\">\n<h3 style=\"margin: 0; font-family: Poppins, sans-serif; font-weight: 600; font-size: 24px; color: #94a3b8\">What you don't get<\u002Fh3>\n<ul style=\"margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 14px\">\n<li style=\"display: flex; gap: 14px; align-items: flex-start; font-size: 17px; line-height: 1.5; color: #94a3b8\"><svg aria-hidden=\"true\" width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" style=\"flex: 0 0 24px; margin-top: 1px\"><path d=\"M5 5 C 10 10, 14 14, 19 19 M19 5 C 14 9, 10 14, 5 19\" fill=\"none\" stroke=\"#94a3b8\" stroke-width=\"2.4\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg>Scores copied from a model card<\u002Fli>\n<li style=\"display: flex; gap: 14px; align-items: flex-start; font-size: 17px; line-height: 1.5; color: #94a3b8\"><svg aria-hidden=\"true\" width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" style=\"flex: 0 0 24px; margin-top: 1px\"><path d=\"M5 5 C 10 10, 14 14, 19 19 M19 5 C 14 9, 10 14, 5 19\" fill=\"none\" stroke=\"#94a3b8\" stroke-width=\"2.4\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg>Release-news recaps<\u002Fli>\n<li style=\"display: flex; gap: 14px; align-items: flex-start; font-size: 17px; line-height: 1.5; color: #94a3b8\"><svg aria-hidden=\"true\" width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" style=\"flex: 0 0 24px; margin-top: 1px\"><path d=\"M5 5 C 10 10, 14 14, 19 19 M19 5 C 14 9, 10 14, 5 19\" fill=\"none\" stroke=\"#94a3b8\" stroke-width=\"2.4\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg>The word \"game-changing\"<\u002Fli>\n<\u002Ful>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- sketched terminal capture -->\n<figure style=\"flex: 1 1 440px; min-width: 0; margin: 0; display: flex; flex-direction: column; gap: 12px\">\n<div style=\"position: relative; padding: 28px 28px 32px\">\n<svg aria-hidden=\"true\" sc-camel-view-box=\"0 0 100 100\" sc-camel-preserve-aspect-ratio=\"none\" style=\"position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none\"><path d=\"M1 1.5 C 30 0.5, 70 2, 99 1 C 99.5 30, 98.6 70, 99 99 C 70 99.6, 30 98.5, 1 99.2 C 0.4 70, 1.5 30, 1 1.5\" fill=\"#0b1222\" stroke=\"#e2e8f0\" stroke-width=\"2\" stroke-linecap=\"round\" vector-effect=\"non-scaling-stroke\"><\u002Fpath><path d=\"M0.4 0.8 C 35 1.8, 65 0.3, 99.6 1.9 C 98.9 35, 100 65, 98.7 99.5 C 65 98.8, 35 100, 0.6 98.6 C 1.2 65, 0 35, 0.4 0.8\" fill=\"none\" stroke=\"#e2e8f0\" stroke-width=\"1\" stroke-linecap=\"round\" vector-effect=\"non-scaling-stroke\"><\u002Fpath><\u002Fsvg>\n<div style=\"position: relative; display: flex; gap: 8px; margin-bottom: 20px\">\n<svg aria-hidden=\"true\" width=\"56\" height=\"14\" sc-camel-view-box=\"0 0 56 14\"><path d=\"M7 2 C 11 2, 12 6, 12 7 C 12 11, 9 12, 7 12 C 3 12, 2 9, 2 7 C 2 4, 4 2, 8 2\" fill=\"none\" stroke=\"#94a3b8\" stroke-width=\"1.8\"><\u002Fpath><path d=\"M27 2 C 31 2, 32 6, 32 7 C 32 11, 29 12, 27 12 C 23 12, 22 9, 22 7 C 22 4, 24 2, 28 2\" fill=\"none\" stroke=\"#94a3b8\" stroke-width=\"1.8\"><\u002Fpath><path d=\"M47 2 C 51 2, 52 6, 52 7 C 52 11, 49 12, 47 12 C 43 12, 42 9, 42 7 C 42 4, 44 2, 48 2\" fill=\"none\" stroke=\"#94a3b8\" stroke-width=\"1.8\"><\u002Fpath><\u002Fsvg>\n<\u002Fdiv>\n<pre style=\"position: relative; margin: 0; font-family: 'Roboto Mono', monospace; font-weight: 500; font-size: 15px; line-height: 1.9; color: #e2e8f0; white-space: pre-wrap; overflow-wrap: anywhere\">$ bench --harness aider --model &lt;name&gt; --quant Q4_K_M --ctx 8192\n<span style=\"color: #94a3b8\">gpu        <\u002Fspan>RTX 4060 Ti 16GB\n<span style=\"color: #94a3b8\">runtime    <\u002Fspan>ollama\n<span style=\"color: #94a3b8\">harness    <\u002Fspan>aider\n<span style=\"color: #94a3b8\">solved     <\u002Fspan>[  ] / [  ] tasks\n<span style=\"color: #94a3b8\">vram_used  <\u002Fspan>[  ] GB\n<span style=\"color: #94a3b8\">tok/s      <\u002Fspan>[  ]\n<span style=\"color: #94a3b8\">verdict    <\u002Fspan>[run it | skip it]<\u002Fpre>\n<\u002Fdiv>\n<figcaption style=\"font-family: Caveat, cursive; font-weight: 700; font-size: 26px; color: #94a3b8; padding-left: 8px\">↑ every video ships with this block<\u002Ffigcaption>\n<\u002Ffigure>\n<\u002Fsection>\n\n<!-- PROCESS -->\n<section style=\"border-top: 1px solid #1e293b\">\n<div style=\"max-width: 1200px; margin: 0 auto; padding: 96px 24px; display: flex; flex-direction: column; gap: 48px\">\n<div style=\"display: flex; flex-direction: column; gap: 16px; max-width: 720px\">\n<p style=\"margin: 0; font-family: 'Roboto Mono', monospace; font-weight: 500; font-size: 14px; color: #94a3b8\">// 03 the process<\u002Fp>\n<h2 style=\"margin: 0; font-family: Poppins, sans-serif; font-weight: 800; font-size: clamp(34px, 4vw, 52px); line-height: 1.08; letter-spacing: -0.02em; color: #e2e8f0\">Constraint first, then the leaderboard<\u002Fh2>\n<\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start\">\n\n<div style=\"flex: 1 1 260px; min-width: 0; display: flex; flex-direction: column; gap: 14px\">\n<svg aria-hidden=\"true\" width=\"64\" height=\"64\" sc-camel-view-box=\"0 0 64 64\"><path d=\"M32 5 C 48 4, 59 16, 58 32 C 57 48, 46 59, 31 58 C 16 57, 5 47, 6 31 C 7 16, 18 6, 34 6\" fill=\"none\" stroke=\"#e2e8f0\" stroke-width=\"2.4\" stroke-linecap=\"round\"><\u002Fpath><text x=\"32\" y=\"42\" text-anchor=\"middle\" font-family=\"Roboto Mono, monospace\" font-weight=\"700\" font-size=\"26\" fill=\"#e2e8f0\">1<\u002Ftext><\u002Fsvg>\n<h3 style=\"margin: 0; font-family: Poppins, sans-serif; font-weight: 800; font-size: 24px; letter-spacing: -0.02em; color: #e2e8f0\">Pick the constraint<\u002Fh3>\n<p style=\"margin: 0; font-size: 16px; line-height: 1.6; color: #94a3b8\">Start from a real limit: <span style=\"font-family: 'Roboto Mono', monospace; font-weight: 500; color: #e2e8f0\">16GB<\u002Fspan> of VRAM, a model size band, a task like coding agents.<\u002Fp>\n<\u002Fdiv>\n\n<svg class=\"bs-flowarrow\" aria-hidden=\"true\" width=\"80\" height=\"64\" sc-camel-view-box=\"0 0 80 64\" style=\"flex: 0 0 80px; margin-top: 4px\"><path d=\"M4 34 C 22 26, 46 38, 70 30\" fill=\"none\" stroke=\"#94a3b8\" stroke-width=\"2.4\" stroke-linecap=\"round\"><\u002Fpath><path d=\"M58 22 L 71 30 L 59 39\" fill=\"none\" stroke=\"#94a3b8\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n\n<div style=\"flex: 1 1 260px; min-width: 0; display: flex; flex-direction: column; gap: 14px\">\n<svg aria-hidden=\"true\" width=\"64\" height=\"64\" sc-camel-view-box=\"0 0 64 64\"><path d=\"M31 6 C 47 5, 58 17, 58 31 C 58 47, 47 58, 32 58 C 15 58, 6 46, 6 32 C 6 17, 17 7, 33 5\" fill=\"none\" stroke=\"#e2e8f0\" stroke-width=\"2.4\" stroke-linecap=\"round\"><\u002Fpath><text x=\"32\" y=\"42\" text-anchor=\"middle\" font-family=\"Roboto Mono, monospace\" font-weight=\"700\" font-size=\"26\" fill=\"#e2e8f0\">2<\u002Ftext><\u002Fsvg>\n<h3 style=\"margin: 0; font-family: Poppins, sans-serif; font-weight: 800; font-size: 24px; letter-spacing: -0.02em; color: #e2e8f0\">Run it the same way<\u002Fh3>\n<p style=\"margin: 0; font-size: 16px; line-height: 1.6; color: #94a3b8\">Same rig, same harness, same prompts. Harness effects get separated from model effects.<\u002Fp>\n<\u002Fdiv>\n\n<svg class=\"bs-flowarrow\" aria-hidden=\"true\" width=\"80\" height=\"64\" sc-camel-view-box=\"0 0 80 64\" style=\"flex: 0 0 80px; margin-top: 4px\"><path d=\"M4 30 C 24 38, 48 24, 70 32\" fill=\"none\" stroke=\"#94a3b8\" stroke-width=\"2.4\" stroke- pen-weight LLMs<\u002Fh3>\n<p style=\"margin: 0; font-size: 16px; line-height: 1.6; color: #94a3b8\">A running series ranking open-weight models on the same bench, one constraint at a time.<\u002Fp>\n<\u002Fa>\n\n<a href=\"#videos\" style=\"flex: 1 1 300px; min-width: 0; text-decoration: none; color: #e2e8f0; display: flex; flex-direction: column; gap: 18px\">\n<svg aria-hidden=\"true\" sc-camel-view-box=\"0 0 320 180\" style=\"width: 100%; height: auto; display: block\">\n<defs><pattern id=\"hachT3\" width=\"10\" height=\"10\" sc-camel-pattern-units=\"userSpaceOnUse\" sc-camel-pattern-transform=\"rotate(-40)\"><line x1=\"0\" y1=\"0\" x2=\"0\" y2=\"10\" stroke=\"#1e293b\" stroke-width=\"3\"><\u002Fline><\u002Fpattern><\u002Fdefs>\n<path d=\"M4 4 C 100 6, 220 2, 316 5 C 317 60, 314 120, 317 176 C 220 178, 100 174, 3 177 C 4 120, 2 60, 4 4\" fill=\"url(#hachT3)\" stroke=\"#e2e8f0\" stroke-width=\"2.2\" stroke-linecap=\"round\"><\u002Fpath>\n<path d=\"M28 40 C 70 38, 110 41, 132 39 C 133 60, 131 80, 133 100 C 110 102, 70 99, 27 101 C 26 80, 29 60, 28 40\" fill=\"#0f172a\" stroke=\"#e2e8f0\" stroke-width=\"2.2\" stroke-linecap=\"round\"><\u002Fpath>\n<text x=\"80\" y=\"78\" text-anchor=\"middle\" font-family=\"Caveat, cursive\" font-weight=\"700\" font-size=\"26\" fill=\"#e2e8f0\">harness<\u002Ftext>\n<path d=\"M188 40 C 230 38, 270 41, 292 39 C 293 60, 291 80, 293 100 C 270 102, 230 99, 187 101 C 186 80, 189 60, 188 40\" fill=\"#0f172a\" stroke=\"#e2e8f0\" stroke-width=\"2.2\" stroke-linecap=\"round\"><\u002Fpath>\n<text x=\"240\" y=\"78\" text-anchor=\"middle\" font-family=\"Caveat, cursive\" font-weight=\"700\" font-size=\"26\" fill=\"#e2e8f0\">model<\u002Ftext>\n<text x=\"160\" y=\"80\" text-anchor=\"middle\" font-family=\"Poppins, sans-serif\" font-weight=\"800\" font-size=\"26\" fill=\"#2563eb\">vs<\u002Ftext>\n<text x=\"30\" y=\"156\" font-family=\"Caveat, cursive\" font-weight=\"700\" font-size=\"24\" fill=\"#94a3b8\">coming next<\u002Ftext>\n<\u002Fsvg>\n<h3 style=\"margin: 0; font-family: Poppins, sans-serif; font-weight: 800; font-size: 24px; letter-spacing: -0.02em\">Harness vs model<\u002Fh3>\n<p style=\"margin: 0; font-size: 16px; line-height: 1.6; color: #94a3b8\">Small local models, <span style=\"font-family: 'Roboto Mono', monospace; font-weight: 500; color: #e2e8f0\">7–12B<\u002Fspan>, run through AutoCodeRover on vLLM. How much is the model, and how much is the scaffold?<\u002Fp>\n<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- CONSULTING -->\n<section id=\"consulting\" style=\"border-top: 1px solid #1e293b\">\n<div style=\"max-width: 1200px; margin: 0 auto; padding: 96px 24px; display: flex; flex-wrap: wrap; gap: 56px; align-items: center\">\n<figure style=\"flex: 1 1 360px; min-width: 0; margin: 0\">\n<svg role=\"img\" aria-label=\"Hand-drawn sketch: a locked box labelled your data sits beside a local model on your own hardware, with a crossed-out cloud\" sc-camel-view-box=\"0 0 440 260\" style=\"width: 100%; height: auto; display: block\">\n<defs><pattern id=\"hachLock\" width=\"8\" height=\"8\" sc-camel-pattern-units=\"userSpaceOnUse\" sc-camel-pattern-transform=\"rotate(-45)\"><line x1=\"0\" y1=\"0\" x2=\"0\" y2=\"8\" stroke=\"#2563eb\" stroke-width=\"2\"><\u002Fline><\u002Fpattern><\u002Fdefs>\n<path d=\"M30 110 C 80 108, 130 111, 170 109 C 172 150, 169 190, 171 228 C 130 230, 80 227, 29 229 C 28 190, 31 150, 30 110\" fill=\"url(#hachLock)\" stroke=\"#e2e8f0\" stroke-width=\"2.4\" stroke-linecap=\"round\"><\u002Fpath>\n<path d=\"M60 108 C 58 70, 70 52, 100 52 C 130 52, 142 70, 140 108\" fill=\"none\" stroke=\"#e2e8f0\" stroke-width=\"2.6\" stroke-linecap=\"round\"><\u002Fpath>\n<rect x=\"52\" y=\"152\" width=\"96\" height=\"40\" rx=\"6\" fill=\"#0f172a\"><\u002Frect>\n<text x=\"100\" y=\"180\" text-anchor=\"middle\" font-family=\"Caveat, cursive\" font-weight=\"700\" font-size=\"26\" fill=\"#e2e8f0\">your data<\u002Ftext>\n<path d=\"M252 120 C 310 117, 370 121, 412 118 C 414 160, 411 196, 413 230 C 370 232, 310 229, 251 231 C 250 196, 253 160, 252 120\" fill=\"none\" stroke=\"#e2e8f0\" stroke-width=\"2.4\" stroke-linecap=\"round\"><\u002Fpath>\n<path d=\"M249 117 C 320 121, 380 116, 410 121 C 411 165, 415 200, 410 233 C 360 230, 300 234, 253 229\" fill=\"none\" stroke=\"#e2e8f0\" stroke-width=\"1.1\" stroke-linecap=\"round\"><\u002Fpath>\n<text x=\"332\" y=\"166\" text-anchor=\"middle\" font-family=\"Caveat, cursive\" font-weight=\"700\" font-size=\"28\" fill=\"#e2e8f0\">local model<\u002Ftext>\n<text x=\"332\" y=\"202\" text-anchor=\"middle\" font-family=\"Roboto Mono, monospace\" font-weight=\"500\" font-size=\"16\" fill=\"#94a3b8\">on-prem<\u002Ftext>\n<path d=\"M180 170 C 200 164, 222 166, 244 172\" fill=\"none\" stroke=\"#e2e8f0\" stroke-width=\"2.4\" stroke-linecap=\"round\"><\u002Fpath>\n<path d=\"M232 162 L 245 172 L 232 181\" fill=\"none\" stroke=\"#e2e8f0\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath>\n<path d=\"M270 70 C 262 70, 256 62, 262 54 C 262 40, 280 34, 290 42 C 296 28, 322 28, 326 44 C 340 42, 348 56, 340 66 C 344 74, 336 80, 328 78 L 274 78 C 268 78, 266 74, 270 70 Z\" fill=\"none\" stroke=\"#94a3b8\" stroke-width=\"2.2\" stroke-linejoin=\"round\"><\u002Fpath>\n<path d=\"M254 92 C 280 70, 320 44, 354 22\" fill=\"none\" stroke=\"#94a3b8\" stroke-width=\"2.6\" stroke-linecap=\"round\"><\u002Fpath>\n<text x=\"360\" y=\"62\" font-family=\"Caveat, cursive\" font-weight=\"500\" font-size=\"22\" fill=\"#94a3b8\">no API calls<\u002Ftext>\n<\u002Fsvg>\n<\u002Ffigure>\n<div style=\"flex: 1 1 460px; min-width: 0; display: flex; flex-direction: column; gap: 24px\">\n<p style=\"margin: 0; font-family: 'Roboto Mono', monospace; font-weight: 500; font-size: 14px; color: #94a3b8\">// 05 consulting<\u002Fp>\n<h2 style=\"margin: 0; font-family: Poppins, sans-serif; font-weight: 800; font-size: clamp(34px, 4vw, 52px); line-height: 1.08; letter-spacing: -0.02em; color: #e2e8f0\">Local AI for advisory and RIA teams<\u002Fh2>\n<p style=\"margin: 0; font-size: 18px; line-height: 1.6; color: #94a3b8\">Private model setup and evaluation for firms that can't send client data to a cloud API. Built by a Series 65 holder with a background in financial markets, using the same test method as the channel.<\u002Fp>\n<ul style=\"margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 12px; font-family: 'Roboto Mono', monospace; font-weight: 500; font-size: 15px; color: #e2e8f0\">\n<li>→ hardware sizing for the models you need<\u002Fli>\n<li>→ model and runtime evaluation on your workloads<\u002Fli>\n<li>→ [YOUR ENGAGEMENT FORMAT + PRICE]<\u002Fli>\n<\u002Ful>\n<div>\n<a href=\"#consulting\" style=\"font-family: 'Roboto Mono', monospace; font-weight: 700; font-size: 16px; color: #e2e8f0; text-decoration: none; border: 1px solid #94a3b8; border-radius: 6px; padding: 16px 24px; min-height: 52px; box-sizing: border-box; display: inline-flex; align-items: center\">Book a call<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- SUBSCRIBE -->\n<section id=\"subscribe\" style=\"border-top: 1px solid #1e293b\">\n<div style=\"max-width: 1200px; margin: 0 auto; padding: 88px 24px; display: flex; flex-direction: column; gap: 20px; align-items: center; text-align: center\">\n<h2 style=\"margin: 0; font-family: Poppins, sans-serif; font-weight: 800; font-size: clamp(30px, 3.4vw, 44px); line-height: 1.1; letter-spacing: -0.02em; color: #e2e8f0\">New benchmarks, when the numbers are in.<\u002Fh2>\n<p style=\"margin: 0; font-size: 17px; line-height: 1.6; color: #94a3b8; max-width: 560px\">One email per video. The command, the config and the result.<\u002Fp>\n<form style=\"display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; width: 100%; max-width: 520px; margin-top: 8px\">\n<label for=\"bs-email\" style=\"position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)\">Email address<\u002Flabel>\n<input id=\"bs-email\" type=\"email\" placeholder=\"you@workstation.local\" style=\"flex: 1 1 260px; min-width: 0; min-height: 52px; box-sizing: border-box; padding: 0 16px; background: #0f172a; color: #e2e8f0; border: 1px solid #94a3b8; border-radius: 6px; font-family: 'Roboto Mono', monospace; font-size: 15px\">\n<button type=\"submit\" style=\"min-height: 52px; padding: 0 24px; background: #e2e8f0; color: #0f172a; border: 0; border-radius: 6px; font-family: 'Roboto Mono', monospace; font-weight: 700; font-size: 15px; cursor: pointer\">notify me<\u002Fbutton>\n<\u002Fform>\n<\u002Fdiv>\n<\u002Fsection>\n<\u002Fmain><header style=\"border-bottom: 1px solid #1e293b\">\n<nav aria-label=\"Primary\" style=\"max-width: 1200px; margin: 0 auto; padding: 20px 24px; display: flex; align-items: center; justify-content: space-between; gap: 24px; flex-wrap: wrap\">\n<a href=\"#top\" class=\"bs-link\" style=\"font-family: Poppins, sans-serif; font-weight: 900; font-size: 24px; letter-spacing: -0.02em; color: #e2e8f0; text-decoration: none\">Buildstation<\u002Fa>\n<div class=\"bs-navlinks\" style=\"display: flex; gap: 32px; align-items: center; font-family: 'Roboto Mono', monospace; font-weight: 500; font-size: 14px\">\n<a href=\"#videos\" class=\"bs-link\" style=\"color: #94a3b8\">videos<\u002Fa>\n<a href=\"#method\" class=\"bs-link\" style=\"color: #94a3b8\">method<\u002Fa>\n<a href=\"#consulting\" class=\"bs-link\" style=\"color: #94a3b8\">consulting<\u002Fa>\n<a href=\"#about\" class=\"bs-link\" style=\"color: #94a3b8\">about<\u002Fa>\n<\u002Fdiv>\n<a href=\"#subscribe\" style=\"font-family: 'Roboto Mono', monospace; font-weight: 700; font-size: 14px; color: #e2e8f0; text-decoration: none; border: 1px solid #94a3b8; border-radius: 6px; padding: 12px 18px; min-height: 44px; box-sizing: border-box; display: inline-flex; align-items: center\">subscribe<\u002Fa>\n<\u002Fnav>\n<\u002Fheader>\n\n\n\n<!-- SERVER + NEURAL NET ILLUSTRATION -->\n<section aria-label=\"Under the hood\" style=\"border-top: 1px s
